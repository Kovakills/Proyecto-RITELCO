{% extends "base.html" %}

{% block title %}Edit Aceite{% endblock %}

{% block content %}
<body>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            color: #27a9c0;
            background-color: #1f2029;
        }

        /* Estilo personalizado para los inputs */
        .inputbox {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .inputbox input {
            position: relative;
            width: 100%;
            padding: 20px 10px 10px;
            background: transparent;
            outline: none;
            box-shadow: none;
            border: none;
            color: #ffffff;
            font-size: 1em;
            letter-spacing: 0.05em;
            transition: 0.5s;
            z-index: 10;
        }

        .inputbox span {
            position: absolute;
            left: 0;
            padding: 20px 10px 10px;
            font-size: 1em;
            color: #8f8f8f;
            letter-spacing: 0.05em;
            transition: 0.5s;
            pointer-events: none;
        }

        .inputbox input:valid ~ span,
        .inputbox input:focus ~ span {
            color: #27a9c0;
            transform: translateX(-10px) translateY(-34px);
            font-size: 0.75em;
        }

        .inputbox i {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: #27a9c0;
            border-radius: 4px;
            transition: 0.5s;
            pointer-events: none;
            z-index: 9;
        }

        .inputbox input:valid ~ i,
        .inputbox input:focus ~ i {
            height: 44px;
        }

        .btn-primary {
            background-color: #27a9c0;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            color: white;
        }

        .btn-primary:hover {
            background-color: lightblue;
        }

        .btn-secondary {
            background-color: #444;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #666;
        }
    </style>
    <div class="section">
        <div class="container mt-5">
        <h1><center>Edit Aceite</center></h1>
        <form method="POST" action="{{ url_for('aceites.edit_aceites', id=aceite.id) }}">
            <div class="inputbox">
                <input type="text" name="nombre" id="nombre" value="{{ aceite.nombre }}" required>
                <span>Nombre</span>
                <i></i>
            </div>

            <div class="inputbox">
                <input type="text" name="tipo_de_aceite" id="tipo_de_aceite" value="{{ aceite.tipo_de_aceite }}" required>
                <span>Tipo de Aceite</span>
                <i></i>
            </div>

            <div class="inputbox">
                <input type="number" name="cantidad" id="cantidad" value="{{ aceite.cantidad }}" min="1" required>
                <span>Galones</span>
                <i></i>
            </div>

            <div class="form-group mt-2">
                <label for="estante_id">Estante</label>
                <select id="estante_id" name="estante_id" required class="form-control">
                    <option value="" disabled>Selecciona un estante</option>
                    {% for estante in estantes %}
                    <option value="{{ estante.id_estante }}" {% if estante.id_estante == aceite.estante_id %}selected{% endif %}>{{ estante.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
            <button class="btn btn-secondary" onclick="window.history.back();">Back</button>
        </form>
    </div>
</body>
{% endblock %}
