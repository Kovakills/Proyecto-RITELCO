{% extends "base.html" %}

{% block title %}Add Herramientas electricas{% endblock %}

{% block content %}

<body>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            color: #27a9c0;
            background-color: #1f2029;
        }

        /* Estilo personalizado para los inputs */
        .inputbox {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .inputbox input {
            position: relative;
            width: 100%;
            padding: 20px 10px 10px;
            background: transparent;
            outline: none;
            box-shadow: none;
            border: none;
            color: #ffffff;
            font-size: 1em;
            letter-spacing: 0.05em;
            transition: 0.5s;
            z-index: 10;
        }

        .inputbox span {
            position: absolute;
            left: 0;
            padding: 20px 10px 10px;
            font-size: 1em;
            color: #8f8f8f;
            letter-spacing: 0.05em;
            transition: 0.5s;
            pointer-events: none;
        }

        .inputbox input:valid~span,
        .inputbox input:focus~span {
            color: #27a9c0;
            transform: translateX(-10px) translateY(-34px);
            font-size: 0.75em;
        }

        .inputbox i {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: #27a9c0;
            border-radius: 4px;
            transition: 0.5s;
            pointer-events: none;
            z-index: 9;
        }

        .inputbox input:valid~i,
        .inputbox input:focus~i {
            height: 44px;
        }

        /* Estilo para los botones */
        .btn-primary {
            background-color: #27a9c0;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            color: white;
        }

        .btn-primary:hover {
            background-color: lightblue;
        }

        .btn-secondary {
            background-color: #444;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #666;
        }

        .inputbox1 {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .inputbox1 span {
            position: absolute;
            top: -20px;
            left: 0;
            font-size: 0.85em;
            color: #27a9c0;
            padding: 0 5px;
            background-color: #1f2029;
        }

        .inputbox1 input[type="date"] {
            width: 15%;
            padding: 15px 10px;
            background: #2a2b38;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: 0.3s;
        }

        .inputbox1 input[type="date"]:focus {
            border-color: #27a9c0;
            background: #1f2029;
        }
    </style>

    <div class="container mt-5">
        <h1>
            <center>Add Herramientas electricas</center>
        </h1>
        <form method="POST" action="{{ url_for('herramientas_electricas.add_herramientas_electricas') }}">
            <div class="inputbox">
                <input type="text" name="nombre" id="nombre" required>
                <span>Responsable</span>
                <i></i>
            </div>
            <div class="inputbox">
                <input type="text" name="marca" id="marca" required>
                <span>Marca</span>
                <i></i>
            </div>
            <div class="inputbox">
                <input type="text" name="modelo" id="modelo" required>
                <span>Modelo</span>
                <i></i>
            </div>
            <div class="inputbox1">
                <span>Fecha de adquisición</span>
                <input type="date" name="fecha_adquisicion" id="fecha_adquisicion" required>
            </div>
            <div class="inputbox">
                <input type="text" name="descripcion_producto" id="descripcion_producto" required>
                <span>Estado</span>
                <i></i>
            </div>
            <div class="form-group mt-2">
                <label for="observacion">Observaciones</label>
                <input type="text" name="observacion" id="observacion" class="form-control">
            </div>
            <div class="form-group">
                <label for="estante_id">Estante ID</label>
                <select id="estante_id" name="estante_id" required class="form-control">
                    <option value="" disabled selected>Selecciona un estante</option>
                    {% for estante in estantes %}
                    <option value="{{ estante.id_estante }}" {% if estante.id_estante==estante.estante_id %}selected{%
                        endif %}>{{ estante.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Add</button>
            <button class="btn btn-secondary" onclick="window.history.back();">Back</button>
        </form>
    </div>
</body>
{% endblock %}
