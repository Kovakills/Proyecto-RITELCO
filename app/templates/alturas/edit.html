{% extends "base.html" %}

{% block title %}Edit Equipo de alturas{% endblock %}

{% block content %}

<body>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            color: #27a9c0;
            background-color: #1f2029;
        }

        .inputbox {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .inputbox input {
            position: relative;
            width: 100%;
            padding: 20px 10px 10px;
            background: transparent;
            outline: none;
            box-shadow: none;
            border: none;
            color: #ffffff;
            font-size: 1em;
            letter-spacing: 0.05em;
            transition: 0.5s;
            z-index: 10;
        }

        .inputbox span {
            position: absolute;
            left: 0;
            padding: 20px 10px 10px;
            font-size: 1em;
            color: #8f8f8f;
            letter-spacing: 0.05em;
            transition: 0.5s;
            pointer-events: none;
        }

        .inputbox input:valid~span,
        .inputbox input:focus~span {
            color: #27a9c0;
            transform: translateX(-10px) translateY(-34px);
            font-size: 0.75em;
        }

        .inputbox i {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: #27a9c0;
            border-radius: 4px;
            transition: 0.5s;
            pointer-events: none;
            z-index: 9;
        }

        .inputbox input:valid~i,
        .inputbox input:focus~i {
            height: 44px;
        }

        .btn-add,
        .btn-back {
            --color: #27a9c0;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 8em;
            height: 2.6em;
            line-height: 2.5em;
            margin: 20px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid var(--color);
            transition: color 0.5s;
            z-index: 1;
            font-size: 17px;
            border-radius: 6px;
            font-weight: 500;
            color: var(--color);
            background-color: transparent;
            text-decoration: none;
        }

        .btn-add:before,
        .btn-back:before {
            content: "";
            position: absolute;
            z-index: -1;
            background: var(--color);
            height: 150px;
            width: 200px;
            border-radius: 50%;
            top: 100%;
            left: 100%;
            transition: all 0.7s;
        }

        .btn-add:hover,
        .btn-back:hover {
            color: #ffffff;
            text-decoration: none;
        }

        .btn-add:hover:before,
        .btn-back:hover:before {
            top: -30px;
            left: -30px;
        }

        .btn-add:active:before,
        .btn-back:active:before {
            background: #27a9c0;
            transition: background 0s;
        }

        .btn-back svg {
            margin-right: 8px;
        }

        .select-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .select-container select {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            padding: 12px 15px;
            font-size: 1em;
            background-color: rgba(42, 43, 56, 0.8);
            border: 2px solid #27a9c0;
            border-radius: 12px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .select-container select:focus {
            outline: none;
            border-color: #3ac7de;
            box-shadow: 0 0 0 3px rgba(39, 169, 192, 0.3);
            background-color: rgba(42, 43, 56, 1);
        }

        .select-container::after {
            content: '\25BC';
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            color: #27a9c0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .select-container:hover::after {
            color: #3ac7de;
        }

        .select-container select option {
            background-color: #2a2b38;
            color: #ffffff;
        }

        .select-label {
            position: absolute;
            top: -14px;
            left: 15px;
            background-color: #1f2029;
            padding: 0 10px;
            font-size: 0.85em;
            color: #27a9c0;
            transition: all 0.3s ease;
        }

        .select-container select:focus+.select-label,
        .select-container select:valid+.select-label {
            color: #3ac7de;
            transform: translateY(-5px);
        }
    </style>

    <div class="section">
        <div class="container mt-5">
            <h1>
                <center>Edit Equipo de Alturas</center>
            </h1>
            <form method="POST"
                action="{{ url_for('equipos_alturas.edit_equipos_alturas', idequiposaltura=equipos_alturas.idequiposaltura) }}">
                <div class="inputbox">
                    <input type="text" name="arnes" id="arnes" value="{{ equipos_alturas.arnes }}" required>
                    <span>Arnés</span>
                    <i></i>
                </div>
                <div class="inputbox">
                    <input type="text" name="eslingas" id="eslingas" value="{{ equipos_alturas.eslingas }}" required>
                    <span>Eslingas</span>
                    <i></i>
                </div>
                <div class="inputbox">
                    <input type="text" name="posicionamiento" id="posicionamiento"
                        value="{{ equipos_alturas.posicionamiento }}" required>
                    <span>Posicionamiento</span>
                    <i></i>
                </div>
                <div class="inputbox">
                    <input type="text" name="caida_en_y" id="caida_en_y" value="{{ equipos_alturas.caida_en_y }}"
                        required>
                    <span>Caída en Y</span>
                    <i></i>
                </div>
                <div class="inputbox">
                    <input type="text" name="conectores" id="conectores" value="{{ equipos_alturas.conectores }}"
                        required>
                    <span>Conectores</span>
                    <i></i>
                </div>
                <div class="inputbox">
                    <input type="number" name="cantidad" id="cantidad" value="{{ equipos_alturas.cantidad }}" min="1"
                        required>
                    <span>Cantidad</span>
                    <i></i>
                </div>

                <div class="select-container">
                    <select id="estante_id" name="estante_id" required>
                        <option value="" disabled>Selecciona un estante</option>
                        {% for estante in estantes %}
                        <option value="{{ estante.id_estante }}" {% if estante.id_estante==equipos_alturas.estante_id
                            %}selected{% endif %}>{{ estante.nombre }}</option>
                        {% endfor %}
                    </select>
                    <label for="estante_id" class="select-label">Estante</label>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a class="btn-back" onclick="window.history.back();">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="feather feather-arrow-left">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back
                    </a>
                    <button type="submit" class="btn-add">Update</button>
                </div>
            </form>
        </div>
    </div>
</body>

{% endblock %}
